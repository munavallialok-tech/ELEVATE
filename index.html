async function handleVideoUpload(input) {

        if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(err.detail || ('Server error ' + res.status)); }
        videoData = await res.json();

    } catch(e) {

function toggleSwatch(id, e) {

}

async function applyVideoAnalysis() {
    if(!selectedColors.size) return toast('Select at least one color!');

    // Extract tracked stats for the selected team colors
    let trackedPlayers = [];
    for (let [pid, pdata] of Object.entries(videoData.players)) {
        if (selectedColors.has(String(pdata.team_id))) {
            trackedPlayers.push(pdata);
        }
    }

    // Only touch roster players Gemini actually identified by jersey number AND
    // whose reported shirt color matches the team color(s) the coach selected —
    // otherwise an opposing player's jersey number could get credited to your
    // squad. No blind 1:1 mapping between arbitrary tracked IDs and roster
    // slots either: YOLO's tracked dots and Gemini's jersey-number reads are
    // separate systems with no shared ID. What we CAN honestly say is: these
    // specific players were confirmed, on your team's color, in the footage —
    // so we apply the clip's team-level aggregate movement to just them.
    let gem = videoData.gemini || {};
    let selectedHexes = [...selectedColors].map(id => videoData.swatches[id]).filter(Boolean);
    let identifiedEntries = getIdentifiedEntries(gem, selectedHexes).filter(e => e.matches);

    let addedDistance = 0, maxSpeed = 0;
    if (trackedPlayers.length) {
        let avgDistance = trackedPlayers.reduce((s, p) => s + p.distance, 0) / trackedPlayers.length;
        addedDistance = parseFloat((avgDistance / 1000).toFixed(2));
        maxSpeed = parseFloat(Math.max(...trackedPlayers.map(p => p.speed)).toFixed(2));
    }

    // Update real movement totals for players already in the roster (this part
    // stays session-only for now — only the names/ratings/notes below are
    // persisted to disk).
    let updatedNames = [];
    identifiedEntries.forEach(e => {
        let n = parseInt(e.num, 10);
        let p = DB.players.find(pl => pl.number === n);
        if (p) {
            p.distance = parseFloat((p.distance + addedDistance).toFixed(2));
            if (maxSpeed > p.topSpeed) p.topSpeed = maxSpeed;
            updatedNames.push(p.name);
        }
    });

    // Persist names/ratings/notes + team history to disk so they survive a
    // server restart. Brand-new jersey numbers come back from this call and
    // get added to the roster as unnamed "Player #N" entries.
    try {
        let r = await fetch('/api/roster/merge', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
            body: JSON.stringify({
                video_label: `Clip analyzed ${new Date().toLocaleDateString()}`,
                players: identifiedEntries.map(e => ({
                    number: String(parseInt(e.num, 10)),
                    rating: e.rating || 0,
                    note: e.note || '',
                    distance_added: addedDistance,
                    top_speed: maxSpeed,
                })),
                team_rating: gem.team_rating || 0,
                team_note: gem.team_note || '',
                team_distance_added: addedDistance,
                team_top_speed: maxSpeed,
            }),
        });
        let data = await r.json().catch(() => null);
        if (data) {
            syncRosterFromIdentities(data, { seedNewPlayers: true, addedDistance, maxSpeed });
            identifiedEntries.forEach(e => {
                let n = parseInt(e.num, 10);
                let p = DB.players.find(pl => pl.number === n);
                if (p && !updatedNames.includes(p.name)) updatedNames.push(p.name);
            });
        }
    } catch (e) { console.warn('Could not save roster update to disk', e); }

    // Add Match to records
    DB.matches.unshift({
        id: "M05", date: "Latest AI Analysis", opponent: "Video Opponent", competition: "Tracked Session", score: "Analyzed", result: "AI", venue: "Video Upload"
    });

    videoData.trackedCount = trackedPlayers.length;
    videoData.updatedPlayerNames = updatedNames;
    videoStatus = 'results';
    coachVideo();
    toast(updatedNames.length
        ? `Tracked ${trackedPlayers.length} players on pitch. Updated AI history for: ${updatedNames.join(', ')}.`
        : `Tracked ${trackedPlayers.length} players on pitch. No jersey numbers matched your selected team color, so no roster stats were updated.`);
}

// Converts a hex swatch color into a simple color word (white/red/blue/etc.)
// so we can line it up against the plain-English shirt color Gemini reports
// for each identified player. This is an approximate bucket match, not a
// pixel-exact comparison — two different systems describing color differently.
function hexToColorName(hex) {
    if (!hex) return '';
    hex = hex.replace('#', '');
    let r = parseInt(hex.substr(0, 2), 16), g = parseInt(hex.substr(2, 2), 16), b = parseInt(hex.substr(4, 2), 16);
    let max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    let l = (max + min) / 2 / 255;
    if (l > 0.82) return 'white';
    if (l < 0.16) return 'black';
    if (d < 28) return 'gray';
    let h;
    if (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h = Math.round(h * 60); if (h < 0) h += 360;
    if (h < 15 || h >= 345) return 'red';
    if (h < 45) return 'orange';
    if (h < 70) return 'yellow';
    if (h < 170) return 'green';
    if (h < 200) return 'cyan';
    if (h < 255) return 'blue';
    if (h < 290) return 'purple';
    return 'pink';
}

// Normalizes Gemini's jersey_numbers (old flat "10" shape or new {number,
// shirt_color} shape) into a consistent list, and flags which entries match
// the team color(s) the coach selected on the swatch screen.
function getIdentifiedEntries(gem, selectedHexes) {
    let jn = (gem && gem.jersey_numbers) || {};
    let selectedNames = (selectedHexes || []).map(hexToColorName);
    return Object.entries(jn).map(([desc, val]) => {
        let isObj = val && typeof val === 'object';
        let num = isObj ? val.number : val;
        let shirtColor = (isObj ? val.shirt_color : '') || '';
        let rating = isObj ? val.rating : null;
        let note = isObj ? val.note : '';
        let matches = !selectedNames.length || selectedNames.some(n => shirtColor.toLowerCase().includes(n));
        return { desc, num, shirtColor, rating, note, matches };
    });
}

// Matches the jersey numbers Gemini read off the footage against the real squad
// roster (by shirt number) so we can show real names instead of throwing the
// numbers away. This is a roster lookup, not a per-dot identity match — YOLO's
// tracked dots and Gemini's jersey-number reading are two separate systems with
// no shared ID, so we show it as its own list rather than labeling the dots.
// Only players whose reported shirt color matches the coach's selected team
// color(s) are shown, so the opposing team doesn't show up in your squad view.
function renderJerseyNames(gem, selectedHexes) {
    let all = getIdentifiedEntries(gem, selectedHexes);
    if (!all.length) {
        return `<div class="card" style="margin-top:16px">
            <h3>Players identified in this clip</h3>
            <p class="muted small">No jersey numbers were clearly readable in this clip, so no names could be matched this time.</p>
        </div>`;
    }
    let shown = all.filter(e => e.matches);
    if (!shown.length) {
        return `<div class="card" style="margin-top:16px">
            <h3>Players identified in this clip</h3>
            <p class="muted small">Gemini read ${all.length} jersey number(s) off the footage, but none matched the shirt color you selected for your team — likely the opposing side. No names shown.</p>
        </div>`;
    }
    let rows = shown.map(e => {
        let n = parseInt(e.num, 10);
        let p = DB.players.find(pl => pl.number === n);
        let label = p ? `${esc(p.name)} <span class="tag">#${n} · ${p.position}</span>` : `Player #${n}`;
        let noteText = [e.desc, e.note].filter(Boolean).map(esc).join(' — ');
        let ratingBadge = (e.rating != null) ? `<b class="up">${e.rating}/10</b>` : '';
        return `<div class="eventline"><div style="flex:1"><b>${label}</b><div class="small muted">${noteText}</div></div>${ratingBadge}</div>`;
    }).join('');
    return `<div class="card" style="margin-top:16px">
        <h3>Players identified in this clip</h3>
        <p class="muted small">Jersey numbers Gemini read from the footage, matched to your squad roster and filtered to your selected team color. Unrecognized numbers are added as new, unnamed roster entries — name them on their profile page.</p>
        ${rows}
    </div>`;
}

// ===== PERSISTENT ROSTER IDENTITIES (survives server restarts via roster_data.json) =====
// Merges the backend's jersey-number -> {name, history} map into DB.players:
// an existing named roster player keeps their name and just gains aiHistory;
// a brand-new jersey number becomes a new "Player #N" entry, unnamed until a
// coach fills in the real name on that player's profile page.
async function loadRosterIdentities() {
    try {
        let r = await fetch('/api/roster/identities');
        let data = await r.json().catch(() => null);
        if (data) syncRosterFromIdentities(data, { seedNewPlayers: true });
    } catch (e) { console.warn('Could not load roster identities', e); }
}

function syncRosterFromIdentities(data, opts) {
    opts = opts || {};
    for (let [num, rec] of Object.entries(data.players || {})) {
        let n = parseInt(num, 10);
        let existing = DB.players.find(p => p.number === n);
        if (existing) {
            existing.aiHistory = rec.history || [];
            // Only AI-created placeholder entries take their name from here —
            // an existing demo-roster player's name is never overwritten.
            if (existing.id && existing.id.startsWith('AI-')) {
                existing.name = rec.name || `Player #${n}`;
                existing.unnamed = !rec.name;
            }
        } else if (opts.seedNewPlayers || (rec.history && rec.history.length)) {
            DB.players.push(makeAiPlaceholderPlayer(n, rec, opts));
        }
    }
}

function makeAiPlaceholderPlayer(number, rec, opts) {
    opts = opts || {};
    let latest = (rec.history || [])[rec.history.length - 1] || {};
    return {
        id: `AI-${number}`, name: rec.name || `Player #${number}`, number,
        position: 'UNK', positionName: 'Identified from video analysis',
        role: 'Tracked', status: 'AI Tracked', age: null, height: null, foot: '—',
        overall: Math.round((latest.rating || 5) * 10),
        stats: { shooting: 50, passing: 50, speed: 50, dribbling: 50, defending: 50, physical: 50 },
        matches: (rec.history || []).length, minutes: 0, goals: 0, assists: 0,
        passAccuracy: 0, passes: 0, tackles: 0, interceptions: 0, saves: 0, cleanSheets: 0,
        distance: opts.addedDistance || 0, topSpeed: opts.maxSpeed || 0,
        trainingScore: 0, practiceScore: 0, improvement: 0,
        trend: (rec.history || []).map(h => (h.rating || 0) * 10).slice(-4),
        weakness: 'unknown', strength: 'unknown', assessment: {},
        assignments: [], matchLogs: [], aiHistory: rec.history || [], unnamed: !rec.name,
    };
}

function renamePlayer(number) {
    let input = $('#renameInput');
    let name = input ? input.value.trim() : '';
    if (!name) return toast('Enter a name first.');
    fetch('/api/roster/rename', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
        body: JSON.stringify({ number: String(number), name }),
    }).then(r => r.json()).then(data => {
        syncRosterFromIdentities(data, {});
        toast(`Saved — this player is now ${name}.`);
        profilePage();
    }).catch(() => toast('Could not save the name. Check the server connection.'));
}

function answerCoach(q){let s=q.toLowerCase(),bench=DB.players.filter(p=>p.status==='Bench'),rank=(arr,fn)=>arr.slice().sort((a,b)=>fn(b)-fn(a));if(s.includes('improv')||s.includes('progress')){let p=rank(DB.players,x=>x.improvement)[0];return `${p.name} (${p.position}) shows the strongest four-week assessment improvement at +${p.improvement} points. Current overall index: ${p.overall}. This reflects the standardized assessment trend, not a guaranteed improvement in match impact.`}if(s.includes('decreas')||s.includes('declin')||s.includes('drop')){let arr=rank(DB.players,x=>x.improvement).reverse(),p=arr[0];return `${p.name} (${p.position}) has the lowest trend in this sample at ${p.improvement>=0?'+':''}${p.improvement} points. Review recent attendance, workload, role and match minutes before drawing conclusions; a small sample can distort the trend.`}if(s.includes('sub')||s.includes('bench')){let role=(s.match(/\b(gk|cb|rb|lb|dm|cm|am|rw|lw|st)\b/i)||[])[1]?.toUpperCase();let arr=bench.filter(p=>!role||p.position===role);if(!arr.length)return `There are no bench players listed for ${role||'that filter'} in the current sample. Try another position.`;let p=rank(arr,x=>x.practiceScore+x.improvement*1.5)[0];return `Among the development/bench group${role?' at '+role:''}, ${p.name} is currently the strongest practice-development candidate: practice index ${p.practiceScore}, four-week change +${p.improvement}, and ${p.positionName} role. This indicates who merits further evaluation, not who should automatically replace a starter.`}if(s.includes('weak')||s.includes('need')||s.includes('training')){let p=selectedPlayer?player(selectedPlayer):DB.players[0];return `The squad's most frequent lower-rated attributes are ${mostWeak()}. For an individual plan, open a player profile and use “AI suggest task”; it uses that player's lowest recorded attribute to draft a focused assignment.`}if(s.includes('squad')||s.includes('team')||s.includes('player')||s.includes('how many'))return `DOOM FC has 25 players: 11 starting XI, ${DB.players.filter(p=>p.status==='Regular Rotation').length} rotation players and ${bench.length} development/bench players. The sample covers four fixtures and four standardized Squad Combine assessments over 18 Oct–13 Nov 2026.`;return `I can answer questions about improvement, declining trends, bench-player candidates by position, squad composition, match records and training needs using the DOOM FC demo dataset. Try: “Which substitute is improving most among centre-backs?”`}

        ${priceBlock(p)}
        <p class="muted small" style="margin:8px 0 0">${p.blurb}</p>
        <div class="small muted" style="margin-top:6px">Built for: <b style="color:var(--text)">${p.who}</b></div>
        <button class="btn ${p.highlight?'primary':''}" style="width:100%;margin-top:auto;padding:10px" onclick="selectPlan('${p.id}')">${p.custom?'Talk to us':'Select plan'}</button>
    </div>`).join('');
    let cell=v=>v===1?'<span class="up">✓</span>':v===0?'<span class="muted">–</span>':`<span class="small">${v}</span>`;
    let head=PLANS.map(p=>`<th style="padding:8px 10px;text-align:center;font-size:12px;${p.highlight?'color:var(--accent)':''}">${p.name}</th>`).join('');
    let rows=FEATURES.map(f=>`<tr style="border-top:1px solid var(--line)"><td style="padding:9px 10px">${f[0]}</td>${f.slice(1).map(v=>`<td style="padding:9px 10px;text-align:center">${cell(v)}</td>`).join('')}</tr>`).join('');
    let sliders=[['match','Per-match clips sold / month',0,500],['solo','Individual athletes',0,500],['team','Team subscriptions',0,100],['academy','Academy licenses',0,20],['league','League clubs onboarded',0,100]].map(s=>`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between" class="small"><span>${s[1]}</span><b id="v_${s[0]}">${rev[s[0]]}</b></div><input type="range" min="${s[2]}" max="${s[3]}" value="${rev[s[0]]}" style="width:100%;accent-color:var(--accent)" oninput="rev['${s[0]}']=+this.value;$('#v_${s[0]}').textContent=this.value;calcUpdate()"></div>`).join('');
    $('#content').innerHTML=pageHead('Plans & pricing','Five revenue streams, one platform: from a single clip to a whole league.',toggle)+
    `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(215px,1fr))">${cards}</div>
    <div class="card" style="margin-top:16px"><h3>What each plan includes</h3><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;min-width:640px"><thead><tr><th style="padding:8px 10px;text-align:left"></th>${head}</tr></thead><tbody>${rows}</tbody></table></div></div>
    <div class="grid two" style="margin-top:16px;align-items:start"><div class="card"><h3>Revenue model calculator</h3><p class="muted small" style="margin-top:0">Drag the sliders to see what a customer base of this size would earn per month at list price.</p>${sliders}<div style="border-top:1px solid var(--line);padding-top:12px;margin-top:4px"><div style="display:flex;justify-content:space-between" class="small"><span>AI &amp; compute cost per analysis (assumption)</span><b id="v_cost">${rupee(costPerAnalysis)}</b></div><input type="range" min="5" max="100" step="5" value="${costPerAnalysis}" style="width:100%;accent-color:var(--accent)" oninput="costPerAnalysis=+this.value;$('#v_cost').textContent=rupee(costPerAnalysis);calcUpdate()"></div></div>
    <div class="card"><h3>Projected revenue</h3><div id="calcOut"></div></div></div>
    <div class="footnote" style="margin-top:16px">Illustrative pricing and projections for the pitch. Prices, customer counts, clips per customer and cost per analysis are assumptions, not measured results. No payment processing is implemented in this prototype.</div>`;
    calcUpdate();
}
function trackingPage(){let dots=[{x:50,y:88,team:0,n:1},{x:18,y:69,team:0,n:2},{x:39,y:76,team:0,n:3},{x:61,y:76,team:0,n:4},{x:82,y:69,team:0,n:5},{x:31,y:52,team:0,n:6},{x:50,y:57,team:0,n:7},{x:69,y:52,team:0,n:8},{x:20,y:27,team:0,n:9},{x:50,y:20,team:0,n:10},{x:80,y:27,team:0,n:11},{x:50,y:12,team:1,n:1},{x:18,y:31,team:1,n:2},{x:39,y:24,team:1,n:3},{x:61,y:24,team:1,n:4},{x:82,y:31,team:1,n:5},{x:31,y:48,team:1,n:6},{x:50,y:43,team:1,n:7},{x:69,y:48,team:1,n:8},{x:20,y:73,team:1,n:9},{x:50,y:80,team:1,n:10},{x:80,y:73,team:1,n:11}];$('#content').innerHTML=pageHead('Live match tracking','Interactive simulated match sequence demonstrating player movement, passes and event capture.',`<span class="pill">SIMULATION · NOT LIVE SENSOR DATA</span>`)+`<div class="grid two"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3>DOOM FC vs RIVERSIDE XI</h3><span class="tag" id="trackClock">00:00 / 01:00</span></div><div class="pitch" id="pitch"><div class="overlay">TACTICAL TRACKING VIEW · TOP-DOWN</div><svg viewBox="0 0 100 100" preserveAspectRatio="none"><rect x="2" y="2" width="96" height="96" stroke="#d2e7d1" stroke-width=".6" fill="none"/><line x1="2" y1="50" x2="98" y2="50" stroke="#d2e7d1" stroke-width=".6"/><circle cx="50" cy="50" r="10" stroke="#d2e7d1" stroke-width=".6" fill="none"/><rect x="28" y="2" width="44" height="13" stroke="#d2e7d1" stroke-width=".6" fill="none"/><rect x="28" y="85" width="44" height="13" stroke="#d2e7d1" stroke-width=".6" fill="none"/><g id="passPath" stroke="#b6f36a" stroke-width=".8" stroke-dasharray="2 1" fill="none"></g><g id="dots">${dots.map((d,i)=>`<g class="trackdot" id="dot${i}" transform="translate(${d.x} ${d.y})"><circle r="2.6" fill="${d.team?'#f1f4fa':'#b6f36a'}" stroke="${d.team?'#8ba0b7':'#39562d'}" stroke-width=".7"/><text y=".9" text-anchor="middle" font-size="2.3" fill="${d.team?'#17202c':'#17200e'}" font-weight="900">${d.n}</text></g>`).join('')}</g><circle id="ball" cx="50" cy="50" r="1.3" fill="#fff" stroke="#1c2935" stroke-width=".5"/></svg></div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn primary" id="playBtn" onclick="toggleMatch()">▶ Play 60-sec demo</button><button class="btn" onclick="resetMatch()">↺ Reset</button><span class="pill" id="matchStatus">Ready</span></div><div class="footnote" style="margin-top:10px">This is a scripted animation with sample event data. It illustrates the intended tracking interface; it does not analyse uploaded match footage or detect real players.</div></div><div class="card"><h3>Live event feed</h3><div id="eventFeed"><div class="eventline"><span class="eventtime">00:04</span><div><b>Pass completed</b><div class="small muted">#8 → #10 · Central channel</div></div></div><div class="eventline"><span class="eventtime">00:12</span><div><b>Progressive carry</b><div class="small muted">#10 · 14 metres forward</div></div></div><div class="eventline"><span class="eventtime">00:21</span><div><b>Shot on target</b><div class="small muted">#9 · Saved by goalkeeper</div></div></div></div></div></div><div class="grid stats-grid" style="margin-top:16px" id="trackingKpis">${kpi('PASSES COMPLETED','0','Simulated events')}${kpi('SHOTS','0','Simulated events')}${kpi('DISTANCE','0.0 km','Illustrative estimate')}${kpi('POSSESSION','50%','Illustrative')}</div>`;resetMatch()}
function eventAt(t){let ev=[['00:04','Pass completed','#8 → #10 · Central channel'],['00:12','Progressive carry','#10 · 14 metres forward'],['00:21','Shot on target','#9 · Saved by goalkeeper'],['00:29','Interception','#6 · Won possession'],['00:37','Switch of play','#6 → #11 · Wide channel'],['00:46','Cross completed','#11 → #9 · Penalty area'],['00:53','Goal','#9 · DOOM FC']];return ev.filter(x=>Number(x[0].slice(3))===t)}
function toggleMatch(){if(matchPlaying){clearInterval(matchInterval);matchPlaying=false;$('#playBtn').textContent='▶ Resume demo';$('#matchStatus').textContent='Paused';return}matchPlaying=true;$('#playBtn').textContent='Ⅱ Pause';$('#matchStatus').textContent='Tracking active';matchInterval=setInterval(()=>{matchSecond++;animateDots(matchSecond);$('#trackClock').textContent=`00:${String(matchSecond).padStart(2,'0')} / 01:00`;let e=eventAt(matchSecond);e.forEach(x=>{let f=$('#eventFeed');f.innerHTML+=`<div class="eventline"><span class="eventtime">${x[0]}</span><div><b>${x[1]}</b><div class="small muted">${x[2]}</div></div></div>`;f.scrollTop=f.scrollHeight});if(matchSecond>=60){clearInterval(matchInterval);matchPlaying=false;$('#playBtn').textContent='↺ Replay demo';$('#matchStatus').textContent='Demo complete';toast('Simulated match sequence completed')}},1000)}
function animateDots(t){let g=$('#dots');if(!g)return;for(let i=0;i<22;i++){let el=$(`#dot${i}`),x=Number(el.dataset.x||el.getAttribute('transform').match(/translate\(([-\d.]+)/)[1]),y=Number(el.dataset.y||el.getAttribute('transform').match(/translate\([-\d.]+\s+([-\d.]+)/)[1]);el.dataset.x=x;el.dataset.y=y;let nx=Math.max(5,Math.min(95,x+Math.sin(t*.25+i*1.7)*.8)),ny=Math.max(5,Math.min(95,y+Math.cos(t*.2+i*1.3)*.65));el.setAttribute('transform',`translate(${nx} ${ny})`)}let ball=$('#ball');if(ball){let x=50+Math.sin(t*.35)*25,y=50+Math.cos(t*.24)*24;ball.setAttribute('cx',x);ball.setAttribute('cy',y)}let k=$('#trackingKpis');if(k)k.innerHTML=[kpi('PASSES COMPLETED',Math.floor(t*.7),'Simulated events'),kpi('SHOTS',Math.floor(t/18),'Simulated events'),kpi('DISTANCE',(t*.018).toFixed(1)+' km','Illustrative estimate'),kpi('POSSESSION',(52+Math.round(9*Math.sin(t/8)))+'%','Illustrative')].join('')}
function resetMatch(){clearInterval(matchInterval);matchPlaying=false;matchSecond=0;$('#trackClock')&&($('#trackClock').textContent='00:00 / 01:00');$('#playBtn')&&($('#playBtn').textContent='▶ Play 60-sec demo');$('#matchStatus')&&($('#matchStatus').textContent='Ready');let f=$('#eventFeed');if(f)f.innerHTML='<div class="eventline"><span class="eventtime">00:04</span><div><b>Pass completed</b><div class="small muted">#8 → #10 · Central channel</div></div></div><div class="eventline"><span class="eventtime">00:12</span><div><b>Progressive carry</b><div class="small muted">#10 · 14 metres forward</div></div></div><div class="eventline"><span class="eventtime">00:21</span><div><b>Shot on target</b><div class="small muted">#9 · Saved by goalkeeper</div></div></div>';document.querySelectorAll('.trackdot').forEach(el=>{delete el.dataset.x;delete el.dataset.y;let i=Number(el.id.slice(3));let coords=[[50,88],[18,69],[39,76],[61,76],[82,69],[31,52],[50,57],[69,52],[20,27],[50,20],[80,27],[50,12],[18,31],[39,24],[61,24],[82,31],[31,48],[50,43],[69,48],[20,73],[50,80],[80,73]][i];el.setAttribute('transform',`translate(${coords[0]} ${coords[1]})`)});$('#ball')&&($('#ball').setAttribute('cx',50),$('#ball').setAttribute('cy',50));}
function showLogin(){currentRole=null;selectedPlayer=null;$('#app').innerHTML=`<div class="login"><div class="loginbox card"><div class="brand"><div class="crest">D</div><div>DOOM FC<div class="eyebrow">PERFORMANCE INTELLIGENCE</div></div></div><div style="margin-top:28px"><div class="eyebrow">WELCOME TO THE CLUB</div><h1 style="font-size:29px;margin:5px 0">One team. Every player. Every metric.</h1><p class="muted">Choose your workspace to explore the DOOM FC performance platform.</p></div><div class="rolecards"><div class="rolecard" onclick="coachLogin()"><div class="icon">▣</div><h3>Login as Coach</h3><div class="small muted">Squad overview, analytics and team tools</div></div><div class="rolecard" onclick="playerSelect()"><div class="icon">♙</div><h3>Login as Player</h3><div class="small muted">Select a player and explore their dashboard</div></div></div><div class="footnote" style="margin-top:22px">DEMO ENVIRONMENT · Fictional club and sample data for prototype demonstration.</div></div></div>`}
function coachLogin(){ $('#app').innerHTML=`<div class="login"><div class="loginbox card"><button class="btn sm ghost" onclick="showLogin()">← Back</button><div class="brand" style="margin:20px 0"><div class="crest">D</div><b>COACH ACCESS</b></div><h2>Welcome, Coach.</h2><p class="muted">Sign in to the DOOM FC team workspace.</p><label class="label">USERNAME</label><input id="username" class="field" placeholder="Enter username"><label class="label">PASSWORD</label><input id="password" type="password" class="field" placeholder="Enter password"><div id="loginError" class="small down"></div><button class="btn primary" style="width:100%;margin-top:14px" onclick="doLogin()">Access dashboard →</button><div class="footnote" style="margin-top:16px">Demo credentials are embedded for this local prototype only. Do not use these credentials in a production deployment.</div></div></div>`}
let authToken=null;
async function doLogin(){
  let u=$('#username').value.trim(),p=$('#password').value,err=$('#loginError');
  if(!u||!p){err.textContent='Enter your username and password.';return}
  let email=u.includes('@')?u.toLowerCase():u.toLowerCase().replace(/\s+/g,'')+'@doom.fc';
  const call=async(path,body)=>{let r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let d=await r.json().catch(()=>({}));return{ok:r.ok,status:r.status,data:d}};
  try{
    let r=await call('login',{email,password:p,role:'coach'});
    // First run only: create the default demo coach account automatically
    if(!r.ok&&r.status===401&&u==='DR DOOM'&&p==='DOOMSDAY'){
      let reg=await call('register',{email,password:p,name:'Dr Doom',role:'coach',code:''});
      if(reg.ok)r=reg;
    }
    if(!r.ok){err.textContent=r.data.detail||'Incorrect username or password.';return}
    authToken=r.data.token;
    currentRole='coach';currentPage='overview';
    await loadRosterIdentities();
    showShell();
  }catch(e){err.textContent='Cannot reach the server. Is it running?'}
}
async function playerSelect(){currentRole='player';await loadRosterIdentities();$('#app').innerHTML=`<div class="wrap"><div class="top"><div class="brand"><div class="crest">D</div><div>DOOM FC<div class="eyebrow">PLAYER PORTAL</div></div></div><button class="btn sm" onclick="showLogin()">Back</button></div><div style="max-width:1100px;margin:45px auto"><div class="eyebrow">PLAYER ACCESS</div><h1>Select your player profile</h1><p class="muted">This demonstration uses profile selection instead of individual player accounts. Each profile reads from the same shared dataset used by the coach dashboard.</p><div class="card"><div class="formrow"><input id="playerSearch" class="field" placeholder="Search player name or ID..." oninput="filterPlayerCards()"><select class="field" id="playerPosition" onchange="filterPlayerCards()"><option value="ALL">All positions</option>${['GK','CB','RB','LB','DM','CM','AM','RW','LW','ST'].map(x=>`<option>${x}</option>`).join('')}</select></div><div id="playerCards" class="grid" style="grid-template-columns:repeat(auto-fill,minmax(210px,1fr));margin-top:16px">${DB.players.map(p=>playerCard(p)).join('')}</div></div></div></div>`}
function playerCard(p){return `<div class="rolecard player-card" data-name="${p.name.toLowerCase()}" data-pos="${p.position}" onclick="selectPlayer('${p.id}')"><div class="playercell"><div class="avatar">${initials(p.name)}</div><div><b>${p.name}</b><div class="small muted">${p.position} · ${p.id}</div></div></div><div style="display:flex;justify-content:space-between;margin-top:15px"><span class="status ${p.status==='Bench'?'bench':''}">${p.status}</span><b>${p.overall} OVR</b></div></div>`}
function filterPlayerCards(){let q=$('#playerSearch').value.toLowerCase(),pos=$('#playerPosition').value;document.querySelectorAll('.player-card').forEach(el=>el.classList.toggle('hidden',!(el.dataset.name.includes(q)||el.textContent.toLowerCase().includes(q))||!(pos==='ALL'||el.dataset.pos===pos)))}
function selectPlayer(id){selectedPlayer=id;currentRole='player';currentPage='overview';playerMessages=[];showShell()}
function showShell(){shell()}
function logout(){clearInterval(matchInterval);authToken=null;showLogin()}
showLogin();
</script></body></html>
